[package]
name = "reposcout"
version = "0.2.0"
edition = "2024"
description = "Fast repository scouting for tokens, complexity, duplication, risk, and Git churn"
license = "MIT"
repository = "https://github.com/gordon1210/reposcout"
readme = "README.md"

[dependencies]
anyhow = "1.0.103"
axum = "0.8"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "8.0.0"
directories = "6.0.0"
futures-util = { version = "0.3.32", default-features = false }
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
ignore = "0.4.27"
indicatif = "0.18.6"
num_cpus = "1.17.0"
notify = "8"
owo-colors = "4.3.0"
rayon = "1.12.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustc-hash = "2.1.3"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
streaming-iterator = "0.1.9"
tar = "0.4.44"
tempfile = "3.27.0"
thiserror = "2.0.18"
tiktoken-rs = "0.12.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1.1.2"
tree-sitter = "0.26.10"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
unicode-width = "0.2.2"
xz2 = { version = "0.1.7", features = ["static"] }
xxhash-rust = { version = "0.8.16", features = ["xxh3"] }
getrandom = "0.4"
libc = "0.2.189"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[lints.rust]
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[lints.clippy]
# Keep Clippy's stable and pedantic groups strict. Restriction and nursery
# lints remain individually selected because those groups are not coherent
# policies when enabled wholesale.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
enum_glob_use = "deny"
expect_used = "deny"
fn_params_excessive_bools = "deny"
large_futures = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
multiple_unsafe_ops_per_block = "deny"
needless_pass_by_value = "deny"
panic = "deny"
struct_excessive_bools = "deny"
todo = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
