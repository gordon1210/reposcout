[package]
name = "reposcout"
version = "0.1.1"
edition = "2024"
description = "Fast repository scouting for tokens, complexity, duplication, risk, and Git churn"
license = "MIT"
repository = "https://github.com/gordon1210/reposcout"
homepage = "https://getreposcout.vercel.app"
readme = "README.md"

[dependencies]
anyhow = "1.0.103"
axum = "0.8"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "7.2.2"
directories = "6.0.0"
futures-util = { version = "0.3.32", default-features = false }
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
ignore = "0.4.27"
indicatif = "0.18.6"
num_cpus = "1.17.0"
notify = "8"
owo-colors = "4.3.0"
rayon = "1.12.0"
rustc-hash = "2.1.3"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
streaming-iterator = "0.1.9"
tempfile = "3.27.0"
thiserror = "2.0.18"
tiktoken-rs = "0.12.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1.1.2"
tree-sitter = "0.26.10"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
xxhash-rust = { version = "0.8.16", features = ["xxh3"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
