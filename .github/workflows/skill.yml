name: Skill CI

on:
  push:
    branches:
      - main
    paths:
      - .agents/skills/reposcout/**
      - .github/workflows/skill.yml
      - scripts/reposcout-skill.sh
      - skills-lock.json
      - skills/reposcout/**
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - .agents/skills/reposcout/**
      - .github/workflows/skill.yml
      - scripts/reposcout-skill.sh
      - skills-lock.json
      - skills/reposcout/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skill:
    name: Skill
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check skill routing and mirror
        run: ./scripts/reposcout-skill.sh check
