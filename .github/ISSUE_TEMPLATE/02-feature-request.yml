name: Feature request
description: Propose a focused improvement to RepoScout
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the problem first so the proposal can be evaluated in context.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for a similar request.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI and reports
        - Analysis and metrics
        - Agent workflows
        - Web dashboard
        - Landing page and documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today, and who does it affect?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behavior or outcome you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any workarounds or other approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or related projects when useful.
